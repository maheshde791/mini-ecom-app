apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: mini-ecom
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mini-ecom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: maheshde791/frontend-service:2.2   # new build with proxy setup
          ports:
            - containerPort: 80
